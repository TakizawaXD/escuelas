version: '3.8'

services:
  web:
    image: php:8.3-apache
    container_name: escuelas-erp-web
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    environment:
      - APP_ENV=development
      - DB_PATH=database/escuela_erp.sqlite
    # Instala soporte para SQLite, activa mod_rewrite de Apache y arranca el servidor
    command: >
      bash -c "
      apt-get update && apt-get install -y libsqlite3-dev &&
      docker-php-ext-install pdo pdo_sqlite &&
      a2enmod rewrite &&
      apache2-foreground
      "
