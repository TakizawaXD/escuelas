spring.application.name=erp
spring.profiles.active=dev

# =====================================
# DATABASE — H2 File-Based (Persistent)
# =====================================
spring.datasource.url=jdbc:h2:file:./data/escuela_erp;DB_CLOSE_DELAY=-1;NON_KEYWORDS=KEY,VALUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=escuela
spring.datasource.password=escuela2024

# H2 Console (dev only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# =====================================
# JPA / Hibernate
# =====================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# =====================================
# SERVER
# =====================================
server.port=8081
server.servlet.context-path=/
server.error.include-message=always
server.error.include-binding-errors=always

# =====================================
# JWT
# =====================================
app.jwt.secret=EscuelaERPSecretKey2024SuperLongSecureKeyForJWTTokenGeneration!@#$
app.jwt.expiration-ms=86400000

# =====================================
# CORS (permite que el frontend PHP llame a la API)
# =====================================
app.cors.allowed-origins=http://localhost:8080,http://127.0.0.1:8080

# =====================================
# MULTIPART (para subida de archivos)
# =====================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB
